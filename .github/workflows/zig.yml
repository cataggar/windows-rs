name: zig

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'zig/**'
      - 'crates/libs/bindgen/default/*.winmd'
      - 'crates/tools/bindings/src/*.txt'
      - '.github/workflows/zig.yml'
  push:
    paths:
      - 'zig/**'
      - 'crates/libs/bindgen/default/*.winmd'
      - 'crates/tools/bindings/src/*.txt'
      - '.github/workflows/zig.yml'
    branches:
      - master
      - zig

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  fmt:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Check formatting
        working-directory: zig
        run: zig fmt --check .

  filter-sync:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check filter files match Rust side
        run: |
          diff -ruN crates/tools/bindings/src/ zig/tools/bindings/src/ \
            || { echo '::error::zig/tools/bindings/src/*.txt is out of sync with crates/tools/bindings/src/*.txt'; exit 1; }

  test:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build and test
        working-directory: zig
        run: zig build test --summary all

  gen:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Regenerate canary bindings
        working-directory: zig
        run: zig build bindings
      - name: Check diff
        shell: bash
        run: |
          git add -N .
          git diff --exit-code || { echo '::error::`zig build bindings` produced changes. Run it locally and commit the updated files under zig/packages/win-sys/src/generated/.'; exit 1; }
