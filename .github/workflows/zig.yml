name: zig

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'zig/**'
      - 'crates/libs/bindgen/default/*.winmd'
      - '.github/workflows/zig.yml'
  push:
    paths:
      - 'zig/**'
      - 'crates/libs/bindgen/default/*.winmd'
      - '.github/workflows/zig.yml'
    branches:
      - master
      - zig

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  fmt:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Check formatting
        working-directory: zig
        run: zig fmt --check .

  test:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build and test
        working-directory: zig
        run: zig build test --summary all
