name: zig

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'zig/**'
      - 'crates/libs/bindgen/default/*.winmd'
      - 'crates/tools/bindings/src/*.txt'
      - '.github/workflows/zig.yml'
  push:
    paths:
      - 'zig/**'
      - 'crates/libs/bindgen/default/*.winmd'
      - 'crates/tools/bindings/src/*.txt'
      - '.github/workflows/zig.yml'
    branches:
      - master
      - zig

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  fmt:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Check formatting
        working-directory: zig
        run: zig fmt --check .

  filter-sync:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check filter files match Rust side
        run: |
          diff -ruN -x '*.rs' crates/tools/bindings/src/ zig/tools/bindings/src/ \
            || { echo '::error::zig/tools/bindings/src/*.txt is out of sync with crates/tools/bindings/src/*.txt'; exit 1; }

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build and test
        working-directory: zig
        run: zig build test --summary all

  gen:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Regenerate canary bindings
        working-directory: zig
        run: |
          zig build bindings
          zig fmt packages/win-sys/src/generated/
      - name: Check diff
        shell: bash
        run: |
          git diff --exit-code -- zig/packages/win-sys/src/generated/ \
            || { echo '::error::`zig build bindings` produced changes. Run it locally and commit the updated files under zig/packages/win-sys/src/generated/.'; exit 1; }

  samples:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build all samples
        working-directory: zig
        run: zig build samples
      - name: Run every sample
        working-directory: zig
        shell: pwsh
        run: |
          $samples = @('last-error', 'load-library', 'threading', 'event-roundtrip', 'desktop-window', 'file-write', 'heap-alloc', 'system-info', 'virtual-alloc', 'well-known-sid', 'debug-output', 'token-elevation', 'file-attributes', 'temp-path')
          foreach ($s in $samples) {
            Write-Host "::group::run-$s"
            zig build "run-$s"
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::sample $s exited with code $LASTEXITCODE"
              exit $LASTEXITCODE
            }
            Write-Host "::endgroup::"
          }

  lib:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-windows
            expected: 0x8664  # IMAGE_FILE_MACHINE_AMD64
          - target: x86-windows
            expected: 0x014c  # IMAGE_FILE_MACHINE_I386
          - target: aarch64-windows
            expected: 0xaa64  # IMAGE_FILE_MACHINE_ARM64
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build kernel32.lib for ${{ matrix.target }}
        working-directory: zig
        run: zig build lib -Dtarget=${{ matrix.target }}
      - name: Verify COFF machine type
        working-directory: zig
        shell: bash
        run: |
          lib=zig-out/lib/kernel32.lib
          test -s "$lib" || { echo "::error::$lib missing or empty"; exit 1; }
          # Short-import header is `00 00 FF FF 00 00 <machine:u16 LE>`;
          # scan the first short-import object and compare machine bytes.
          machine_hex=$(python3 -c "
          import sys
          data = open('$lib','rb').read()
          i = data.find(b'\x00\x00\xff\xff\x00\x00')
          if i < 0:
              sys.exit('no short import found')
          m = data[i+6] | (data[i+7] << 8)
          print(f'0x{m:04x}')
          ")
          echo "machine = $machine_hex (expected ${{ matrix.expected }})"
          [ "$machine_hex" = "${{ matrix.expected }}" ] \
            || { echo "::error::machine type mismatch for ${{ matrix.target }}"; exit 1; }
